# ==============================================================================
# Render Blueprint Specification — CricScript AI Unified Full-Stack Studio
# Single-Service Deployment: Express API + Vite Frontend SPA (Zero-CORS Architecture)
# ==============================================================================

services:
  - type: web
    name: cricscript-ai-studio
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Google Gemini API Key (Required for script & research synthesis)
      - key: GEMINI_API_KEY
        sync: false

      # Optional secondary Gemini API Key
      - key: GEMINI_API_KEY_RESEARCH
        sync: false

      # Tavily Web Search API Key (Required for live multi-hop research)
      - key: TAVILY_API_KEY
        sync: false

      # Pinecone Vector DB Key (Optional; falls back to local style exemplar repository)
      - key: PINECONE_API_KEY
        sync: false

      - key: PINECONE_INDEX_NAME
        value: cricscript-rag
