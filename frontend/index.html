<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="background-color: #08090b; color: #f5f5f5;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Instant Anti-FOUC Paint Guard: Eliminates all white/black flash before CSS/JS loads -->
    <style>
      html, body {
        background-color: #08090b;
        color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      html.light, html.light body {
        background-color: #f4f5f7;
        color: #12151a;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('cricscript-theme');
          var d = document.documentElement;
          if (t === 'light') {
            d.classList.remove('dark');
            d.classList.add('light');
            d.setAttribute('data-theme', 'light');
            d.style.backgroundColor = '#f4f5f7';
            d.style.color = '#12151a';
          } else {
            d.classList.add('dark');
            d.classList.remove('light');
            d.setAttribute('data-theme', 'dark');
            d.style.backgroundColor = '#08090b';
            d.style.color = '#f5f5f5';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Metadata -->
    <title>CricScript AI — Cinematic Cricket Research & Scriptwriting Studio</title>
    <meta name="title" content="CricScript AI — Cinematic Cricket Research & Scriptwriting Studio" />
    <meta
      name="description"
      content="Autonomous AI documentary studio for cricket creators. Multi-hop scorecard research, zero-hallucination fact grounding, and cadence-matched Hinglish video scripts under 1,000 words."
    />
    <meta name="keywords" content="cricket, ai scriptwriter, cricket documentary, hinglish scripts, scorecard research, match analysis, virat kohli, ashes, cricscript" />
    <meta name="author" content="CricScript AI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cricpitch.vercel.app/" />

    <!-- Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / Facebook -->
